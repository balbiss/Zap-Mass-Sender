version: '3.8'

services:
  zap-mass:
    image: node:20-alpine
    container_name: zap-mass-sender
    restart: always
    working_dir: /app
    ports:
      - "8899:8899"
    command: >
      sh -c "echo '🚀 Starting ZapMass v1.201 Debug Deployment...' &&
             apk add --no-cache git &&
             rm -rf /app_tmp &&
             git clone -b main https://github.com/balbiss/Zap-Mass-Sender.git /app_tmp &&
             echo '--- CLONED LOG ---' &&
             cd /app_tmp && git log -1 --oneline && cd /app &&
             echo '--- REPLACING FILES ---' &&
             cp -f /app_tmp/server.js ./server.js &&
             cp -f /app_tmp/package.json ./package.json &&
             echo '--- VERIFYING FILE ---' &&
             grep 'V1.200' server.js || echo '❌ VERSION NOT FOUND IN server.js' &&
             echo 'Installing dependencies...' &&
             npm install &&
             echo 'Starting ZapMass...' &&
             node server.js"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WUZAPI_BASE_URL=${WUZAPI_BASE_URL}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORT=8899
