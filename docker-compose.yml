version: '3.8'

services:
  zap-mass:
    image: node:20-alpine
    container_name: zap-mass-sender
    restart: always
    working_dir: /app
    ports:
      - "8899:8899"
    command: >
      sh -c "echo '🚀 ZapMass V1.230 Deployment...' &&
             apk add --no-cache git &&
             rm -rf /app_tmp &&
             echo '📥 Cloning latest code...' &&
             GIT_TERMINAL_PROMPT=0 git clone -b main --depth 1 --no-single-branch https://github.com/balbiss/Zap-Mass-Sender.git /app_tmp &&
             echo '--- GIT INFO ---' &&
             cd /app_tmp && git log -1 --oneline && git rev-parse HEAD && cd /app &&
             echo '--- COPYING FILES ---' &&
             cp -f /app_tmp/server.js ./server.js &&
             cp -f /app_tmp/package.json ./package.json &&
             echo '--- INSTALLING ---' &&
             npm install &&
             echo '🚀 Starting...' &&
             node server.js"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WUZAPI_BASE_URL=${WUZAPI_BASE_URL}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORT=8899
      - ADMIN_CHAT_ID=7924857149
