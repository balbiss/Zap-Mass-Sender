version: '3.8'

services:
  zap-mass:
    image: node:20-alpine
    container_name: zap-mass-sender
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8899:8899"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WUZAPI_BASE_URL=${WUZAPI_BASE_URL}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - PORT=8899
    command: sh -c "npm install && npm start"
