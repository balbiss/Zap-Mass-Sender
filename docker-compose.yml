version: '3.8'

services:
  zap-mass:
    image: node:20-alpine
    container_name: zap-mass-sender
    restart: always
    working_dir: /app
    ports:
      - "8899:8899"
    command: >
      sh -c "echo 'Starting ZapMass deployment...' &&
             apk add --no-cache git &&
             echo 'Cloning repository...' &&
             rm -rf /app_tmp &&
             git clone https://github.com/balbiss/Zap-Mass-Sender.git /app_tmp &&
             cp -rf /app_tmp/* . &&
             cp -rf /app_tmp/.* . 2>/dev/null || true &&
             echo 'Installing dependencies...' &&
             npm install &&
             echo 'Starting ZapMass...' &&
             node server.js"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - WUZAPI_BASE_URL=${WUZAPI_BASE_URL}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORT=8899
